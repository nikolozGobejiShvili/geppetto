<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.16" numOctaves="2" seed="11" stitchTiles="stitch" result="bands"/>
    <feColorMatrix in="bands" values="0 0 0 0 0.60  0 0 0 0 0.38  0 0 0 0 0.16  0.30 0 0 0 -0.11" result="soft"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.75" numOctaves="1" seed="5" stitchTiles="stitch" result="fine"/>
    <feColorMatrix in="fine" values="0 0 0 0 0.52  0 0 0 0 0.30  0 0 0 0 0.12  1.7 0 0 0 -1.06" result="ticks"/>
    <feMerge>
      <feMergeNode in="soft"/>
      <feMergeNode in="ticks"/>
    </feMerge>
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)"/>
</svg>
